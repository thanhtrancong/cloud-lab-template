name = "cloud-lab-worker"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[env.production]
name = "cloud-lab-worker-prod"

[[env.production.routes]]
pattern = "api.example.com/*"
zone_name = "example.com"

[build]
command = "npm install"

[build.upload]
format = "modules"
main = "./src/worker.js"
